name: Backend tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/support.py points the app at a throwaway SQLite database and a test-only JWT secret
      - name: Run statistical reference and endpoint tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -t . -v
